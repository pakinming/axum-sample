name: Deploy to Coolify (Self-Hosted Runner)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Optional: show commit info (debug)
      - name: Show commit
        run: |
          echo "Deploying commit: $GITHUB_SHA"
          echo "Branch: $GITHUB_REF_NAME"

      # 3. Trigger Coolify deployment
      - name: Trigger Coolify Deploy
        run: |
          curl -X GET \
            "http://${{ vars.IP_ADDRESS }}:8000/api/v1/deploy?uuid=${{ secrets.COOLIFY_UUID }}&force=false"

      # 4. Optional: wait a bit for deployment to start
      - name: Wait for deployment
        run: sleep 5